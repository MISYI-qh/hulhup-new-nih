name: hulhup
description: Hulhup - ketuk, dengarkan suara acak. Produk Misyi.
publish_to: none
version: 1.3.0+4
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  record: ^7.1.2
  file_picker: ^10.0.0
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  url_launcher: ^6.3.0
  web: ^1.0.0
  open_filex: ^4.5.0
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  workmanager: any
  firebase_core: any
  firebase_messaging: any
dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B0B0B"
  image: assets/splash/logo.png
  image_dark: assets/splash/logo_dark.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0B0B0B"
    image: assets/splash/logo12.png
    image_dark: assets/splash/logo12_dark.png
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#5B47F5"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
