name: android-native
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Bangun APK (Kotlin + Compose), tanda tangan sama dengan APK lama
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export BUILD=${{ github.run_number }}
          export DL_KEY=$(printf 'dl:%s' "$KEYSTORE_PASSWORD" | sha256sum | cut -c1-32)
          gradle -p android-native assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: hulhup-native-apk, path: android-native/app/build/outputs/apk/release/*.apk }
